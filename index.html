<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kordonowa Liga Wyścigowa - Taryfikator i Admin</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        body {
            background-color: #11141a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid #333;
            margin-bottom: 30px;
            position: relative;
        }
        .header h1 {
            margin: 0;
            font-size: 2.5em;
            letter-spacing: 2px;
            color: #e0e0e0;
        }
        .admin-toggle {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
        }
        .admin-toggle:hover:not(:disabled) {
            background: #2980b9;
        }
        .admin-toggle.active {
            background: #e74c3c;
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3);
        }
        .admin-toggle:disabled {
            background: #555;
            cursor: not-allowed;
        }
        
        .logout-btn {
            background: #7f8c8d;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            margin-top: 15px;
            margin-left: 10px;
            transition: all 0.3s ease;
            display: none;
        }
        .logout-btn:hover {
            background: #95a5a6;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background: #1e222b;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }
        .card-header {
            padding: 15px;
            font-weight: bold;
            font-size: 1.2em;
            text-align: center;
            color: #111;
            text-transform: uppercase;
        }
        .card-body {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .rule-item {
            background: #2a2f3a;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 4px solid transparent;
            display: flex;
            flex-direction: column;
            gap: 5px;
            position: relative;
        }
        .rule-title, .rule-penalty {
            display: block;
        }
        .rule-title {
            font-weight: bold;
            color: #fff;
        }
        .rule-penalty {
            color: #aaa;
            font-size: 0.9em;
        }
        
        .edit-input {
            width: 100%;
            background: #11141a;
            border: 1px solid #555;
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            font-family: inherit;
            box-sizing: border-box;
            font-size: 0.9em;
        }
        .edit-input:focus {
            outline: none;
            border-color: #3498db;
        }
        .title-input {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .header-input {
            text-align: center;
            font-weight: bold;
            font-size: 1em;
            text-transform: uppercase;
            color: #fff;
        }
        
        .delete-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            padding: 2px 8px;
            font-size: 0.8em;
            font-weight: bold;
            z-index: 5;
        }
        .delete-btn:hover { background: #c0392b; }

        .add-rule-btn {
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            padding: 10px;
            font-weight: bold;
            width: 100%;
            margin-top: auto;
            transition: 0.2s;
        }
        .add-rule-btn:hover { background: #27ae60; }

        .cat-yellow .card-header { background: #f1c40f; }
        .cat-yellow .rule-item { border-left-color: #f1c40f; }
        
        .cat-orange .card-header { background: #e67e22; }
        .cat-orange .rule-item { border-left-color: #e67e22; }
        
        .cat-red .card-header { background: #e74c3c; }
        .cat-red .rule-item { border-left-color: #e74c3c; }
        
        .cat-purple .card-header { background: #9b59b6; color: #fff; }
        .cat-purple .rule-item { border-left-color: #9b59b6; }

        .footer-limits {
            max-width: 1400px;
            margin: 40px auto 0;
            background: #1e222b;
            border-radius: 10px;
            padding: 20px;
            border-left: 4px solid #3498db;
        }

        /* Nowe style dla okienka logowania (Modal) */
        .login-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-content {
            background: #1e222b;
            padding: 30px;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            border-top: 4px solid #3498db;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .modal-content h3 { margin: 0 0 5px 0; text-align: center; }
        .modal-btn {
            background: #3498db; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        .modal-btn:hover { background: #2980b9; }
        .modal-cancel { background: #7f8c8d; }
        .modal-cancel:hover { background: #95a5a6; }
    </style>
</head>
<body>

    <div class="header">
        <h1>KORDONOWA LIGA WYŚCIGOWA</h1>
        <p>OFICJALNY TARYFIKATOR PRZEWINIEŃ</p>
        <button class="admin-toggle" id="adminBtn" onclick="toggleAdmin()">ŁADOWANIE...</button>
        <button class="logout-btn" id="logoutBtn" onclick="logoutAdmin()">WYLOGUJ</button>
    </div>

    <div class="login-modal" id="loginModal">
        <div class="modal-content">
            <h3>Logowanie Administratora</h3>
            <input type="email" id="loginEmail" class="edit-input" placeholder="Adres E-mail">
            <input type="password" id="loginPassword" class="edit-input" placeholder="Hasło">
            <button class="modal-btn" onclick="submitLogin()">ZALOGUJ</button>
            <button class="modal-btn modal-cancel" onclick="closeLoginModal()">ANULUJ</button>
        </div>
    </div>

    <div class="grid-container" id="penaltyGrid">
        <p style="text-align: center; grid-column: 1/-1;">Pobieranie aktualnych danych z toru...</p>
    </div>

    <div class="footer-limits">
        <h2 style="margin-top:0; color: #3498db;">SYSTEM PUNKTÓW KARNYCH</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 20px;" id="limitsContainer">
            </div>
    </div>

    <script>
        // -------------------------------------------------------------------------
        // 1. TUTAJ WKLEJ SWOJĄ KONFIGURACJĘ Z FIREBASE (Project Settings -> Your Apps)
        // -------------------------------------------------------------------------
        const firebaseKonfiguracja = {

            apiKey: "AIzaSyDB5lU3ECJLdSQ5f5kl-Ex5_cktVrBdD4o",

            AuthDomaina: "regklw.firebaseapp.com",

            databaseURL: "https://regklw-default-rtdb.europe-west1.firebasedatabase.app",

            projectId: "regklow",

            magazynbucket: "regklw.firebasestore.app",

            wiadomościSenderId: "216737822642",

            appId: "1:216737822642:web:1b04543445f19db9fd6ab",

            pomiarId: "G-CNQNEWGS58"

       };

        // Inicjalizacja Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let isAdminMode = false;

        // Śledzenie stanu zalogowania (Przeglądarka automatycznie pamięta sesję!)
        auth.onAuthStateChanged((user) => {
            const logoutBtn = document.getElementById('logoutBtn');
            const adminBtn = document.getElementById('adminBtn');
            
            if (user) {
                logoutBtn.style.display = 'inline-block';
            } else {
                logoutBtn.style.display = 'none';
                if (isAdminMode) {
                    exitAdminVisual(false); // Jeśli wylogowano, wyjdź z edycji bez zapisu
                }
            }
            adminBtn.innerText = isAdminMode ? "ZAPISZ ZMIANY" : "PANEL ADMINA";
            adminBtn.disabled = false;
        });

        // Ładowanie danych z bazy przy uruchomieniu strony
        window.addEventListener('DOMContentLoaded', () => {
            loadFromFirebase();
        });

        async function loadFromFirebase() {
            try {
                const snapshot = await db.ref('taryfikator').once('value');
                const data = snapshot.val();
                
                if (data) {
                    renderData(data);
                } else {
                    // Jeśli baza jest pusta, załaduj strukturę startową
                    renderDefaultStructure();
                }
            } catch (error) {
                console.error("Błąd ładowania z chmury:", error);
                document.getElementById('penaltyGrid').innerHTML = "<p>Błąd pobierania danych. Spróbuj odświeżyć stronę.</p>";
            }
        }

        function renderData(data) {
            const grid = document.getElementById('penaltyGrid');
            grid.innerHTML = ''; 

            data.categories.forEach(cat => {
                let rulesHtml = '';
                if (cat.rules) {
                    cat.rules.forEach(rule => {
                        rulesHtml += `
                            <div class="rule-item">
                                <span class="rule-title">${rule.title}</span>
                                <span class="rule-penalty">${rule.penalty}</span>
                            </div>
                        `;
                    });
                }
                grid.innerHTML += `
                    <div class="card ${cat.categoryClass}">
                        <div class="card-header"><span class="header-text">${cat.headerText}</span></div>
                        <div class="card-body">${rulesHtml}</div>
                    </div>
                `;
            });

            const limitsContainer = document.getElementById('limitsContainer');
            limitsContainer.innerHTML = '';
            data.limits.forEach(limit => {
                limitsContainer.innerHTML += `
                    <div class="limit-item" style="flex: 1; min-width: 200px;">
                        <span class="limit-pk" style="${limit.pkStyle}">${limit.pkText}</span> - <span class="limit-desc">${limit.descText}</span>
                    </div>
                `;
            });
        }

        // Obsługa logowania
        function toggleAdmin() {
            if (!auth.currentUser) {
                document.getElementById('loginModal').style.display = 'flex';
            } else {
                if (!isAdminMode) {
                    enterAdminVisual();
                } else {
                    saveAndExitAdmin();
                }
            }
        }

        async function submitLogin() {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            try {
                await auth.signInWithEmailAndPassword(email, pass);
                closeLoginModal();
                enterAdminVisual();
            } catch (err) {
                alert("Błąd logowania: Zły e-mail lub hasło!");
            }
        }

        function closeLoginModal() {
            document.getElementById('loginModal').style.display = 'none';
        }

        async function logoutAdmin() {
            if(confirm("Czy na pewno chcesz się wylogować?")) {
                await auth.signOut();
                alert("Wylogowano.");
            }
        }

        // Tryb Wizualny - Przekształcenie tekstu w Inputy
        function enterAdminVisual() {
            const btn = document.getElementById('adminBtn');
            
            document.querySelectorAll('.card').forEach(card => {
                const headerSpan = card.querySelector('.header-text');
                headerSpan.innerHTML = `<input type="text" class="edit-input header-input" value="${headerSpan.innerText}">`;

                const cardBody = card.querySelector('.card-body');
                cardBody.querySelectorAll('.rule-item').forEach(item => {
                    const t = item.querySelector('.rule-title').innerText;
                    const p = item.querySelector('.rule-penalty').innerText;
                    item.innerHTML = `
                        <button class="delete-btn" onclick="this.parentElement.remove()">X</button>
                        <input type="text" class="edit-input title-input" value="${t}">
                        <input type="text" class="edit-input penalty-input" value="${p}">
                    `;
                });

                const addBtn = document.createElement('button');
                addBtn.className = 'add-rule-btn';
                addBtn.innerText = '+ Dodaj regułę';
                addBtn.onclick = function() { addRule(this); };
                cardBody.appendChild(addBtn);
            });

            document.querySelectorAll('.limit-item').forEach(item => {
                const pkSpan = item.querySelector('.limit-pk');
                const descSpan = item.querySelector('.limit-desc');
                const style = pkSpan.getAttribute('style') || '';
                item.innerHTML = `
                    <input type="text" class="edit-input limit-pk-input" value="${pkSpan.innerText}" data-style="${style}" style="width:30%; display:inline-block;"> - 
                    <input type="text" class="edit-input limit-desc-input" value="${descSpan.innerText}" style="width:60%; display:inline-block;">
                `;
            });

            btn.innerText = "ZAPISZ ZMIANY";
            btn.classList.add('active');
            isAdminMode = true;
        }

        function addRule(btn) {
            const item = document.createElement('div');
            item.className = 'rule-item';
            item.innerHTML = `
                <button class="delete-btn" onclick="this.parentElement.remove()">X</button>
                <input type="text" class="edit-input title-input" value="Nowe przewinienie">
                <input type="text" class="edit-input penalty-input" value="Brak kary">
            `;
            btn.parentNode.insertBefore(item, btn);
        }

        // Wyjście z zapisem do chmury
        async function saveAndExitAdmin() {
            const btn = document.getElementById('adminBtn');
            btn.innerText = "ZAPISYWANIE...";
            btn.disabled = true;

            const payload = { categories: [], limits: [] };

            // Zbieranie danych z kart
            document.querySelectorAll('.card').forEach(card => {
                const headerText = card.querySelector('.header-input').value;
                const categoryClass = Array.from(card.classList).find(c => c.startsWith('cat-'));
                const rules = [];
                
                card.querySelectorAll('.rule-item').forEach(item => {
                    const title = item.querySelector('.title-input').value;
                    const penalty = item.querySelector('.penalty-input').value;
                    rules.push({ title, penalty });
                });
                payload.categories.push({ headerText, categoryClass, rules });
            });

            // Zbieranie danych z limitów
            document.querySelectorAll('.limit-item').forEach(item => {
                const pkInput = item.querySelector('.limit-pk-input');
                const descInput = item.querySelector('.limit-desc-input');
                payload.limits.push({
                    pkText: pkInput.value,
                    pkStyle: pkInput.getAttribute('data-style'),
                    descText: descInput.value
                });
            });

            try {
                // Bezpieczny zapis bezpośrednio przez SDK zalogowanego admina
                await db.ref('taryfikator').set(payload);
                renderData(payload); // Przywróć czysty tekst
                isAdminMode = false;
                btn.innerText = "PANEL ADMINA";
                btn.classList.remove('active');
            } catch (err) {
                alert("Błąd zapisu! Sprawdź reguły Firebase. " + err.message);
                btn.innerText = "ZAPISZ ZMIANY";
            }
            btn.disabled = false;
        }

        function exitAdminVisual(restoreText = false) {
            isAdminMode = false;
            loadFromFirebase(); // Najprostszy powrót to ponowne załadowanie danych z chmury
        }

        // Struktura awaryjna (gdy baza jest pusta)
        function renderDefaultStructure() {
            const defaultData = {
                categories: [
                    { headerText: "LEKKIE PRZEWINIENIA", categoryClass: "cat-yellow", rules: [{title: "Wypychanie poza tor", penalty: "3 sekundy oraz 1-3 PK"}] },
                    { headerText: "ZAGROŻENIE NA TORZE", categoryClass: "cat-orange", rules: [{title: "Niebezpieczna zmiana linii jazdy", penalty: "3-5 sekund"}] },
                    { headerText: "POWAŻNE INCYDENTY", categoryClass: "cat-red", rules: [{title: "Spowodowanie kolizji", penalty: "3-10 sekund"}] },
                    { headerText: "KARY EKSTREMALNE", categoryClass: "cat-purple", rules: [{title: "Użycie funkcji Powrót na tor", penalty: "DSQ"}] }
                ],
                limits: [
                    { pkText: "8 PK", pkStyle: "color: #f1c40f; font-weight: bold;", descText: "Ban na kwalifikacje" },
                    { pkText: "16 PK", pkStyle: "color: #e67e22; font-weight: bold;", descText: "Ban na wyścig" },
                    { pkText: "24 PK", pkStyle: "color: #e74c3c; font-weight: bold;", descText: "Ban na dwa wyścigi" },
                    { pkText: "32 PK", pkStyle: "color: #9b59b6; font-weight: bold;", descText: "Usunięcie z ligi" }
                ]
            };
            renderData(defaultData);
        }
    </script>
</body>
</html>
